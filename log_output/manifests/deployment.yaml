apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      volumes:
      - name: shared-storage
        persistentVolumeClaim:
          claimName: shared-storage-claim
      containers:
        - name: writer
          image: log-output-writer:latest
          imagePullPolicy: Never
          volumeMounts:
            - name: shared-storage
              mountPath: /usr/src/app/files
        - name: reader
          image: log-output-reader:latest
          imagePullPolicy: Never
          ports:
           - containerPort: 3000
          volumeMounts:
            - name: shared-storage
              mountPath: /usr/src/app/files

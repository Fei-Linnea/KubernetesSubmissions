apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - todo-app/cluster-storage/persistentvolumeclaim.yaml
  - todo-app/manifests/deployment.yaml
  - todo-app/manifests/service.yaml
  - todo-app/manifests/configmap.yaml
  - todo-app/manifests/ingress.yaml
  - todo-backend/manifests/deployment.yaml
  - todo-backend/manifests/service.yaml
  - todo-backend/manifests/configmap.yaml
  - todo-backend/manifests/secret.yaml
  - todo-backend/manifests/statefulset.yaml
  - todo-backend/manifests/cronjob.yaml
  - todo-backend/manifests/backup-cronjob.yaml
namespace: project
images:
  - name: TODO-APP/IMAGE
    newName: flhaka/todo-app
    newTag: latest
  - name: TODO-BACKEND/IMAGE
    newName: flhaka/todo-backend
    newTag: latest

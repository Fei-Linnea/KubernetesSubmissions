name: Build and publish application

on:
  push:
    branches:
      - main
    tags:
      - '*'

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  REGISTRY: europe-north1-docker.pkg.dev
  REPOSITORY: my-repository
  CONFIG_REPOSITORY: Fei-Linnea/KubernetesSubmissions-config

jobs:
  build-publish:
    name: Build, Push and Release
    runs-on: ubuntu-latest
    environment: GKE_PROJECT

    steps:
      - name: Checkout code repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.SERVICE_ACCOUNT }}"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud --quiet auth configure-docker $REGISTRY

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Build and push todo-app
        run: |
          IMAGE_TAG="$REGISTRY/$PROJECT_ID/$REPOSITORY/todo-app:$GITHUB_SHA"
          docker build -t "$IMAGE_TAG" the_project/base/todo-app
          docker push "$IMAGE_TAG"
          echo "TODO_APP_IMAGE=$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Build and push todo-backend
        run: |
          IMAGE_TAG="$REGISTRY/$PROJECT_ID/$REPOSITORY/todo-backend:$GITHUB_SHA"
          docker build -t "$IMAGE_TAG" the_project/base/todo-backend
          docker push "$IMAGE_TAG"
          echo "TODO_BACKEND_IMAGE=$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Build and push broadcaster
        run: |
          IMAGE_TAG="$REGISTRY/$PROJECT_ID/$REPOSITORY/broadcaster:$GITHUB_SHA"
          docker build -t "$IMAGE_TAG" the_project/base/broadcaster
          docker push "$IMAGE_TAG"
          echo "BROADCASTER_IMAGE=$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Checkout configuration repository
        uses: actions/checkout@v6
        with:
          repository: ${{ env.CONFIG_REPOSITORY }}
          token: ${{ secrets.CONFIG_REPO_TOKEN }}
          path: config

      - name: Update staging configuration
        if: github.ref == 'refs/heads/main'
        run: |
          cd config/the_project/overlays/staging
          kustomize edit set image TODO-APP/IMAGE=${{ env.TODO_APP_IMAGE }}
          kustomize edit set image TODO-BACKEND/IMAGE=${{ env.TODO_BACKEND_IMAGE }}
          kustomize edit set image flhaka/broadcaster=${{ env.BROADCASTER_IMAGE }}

      - name: Commit staging configuration
        if: github.ref == 'refs/heads/main'
        uses: EndBug/add-and-commit@v10
        with:
          cwd: ./config
          add: 'the_project/overlays/staging/kustomization.yaml'
          message: 'Release staging ${{ github.sha }} [skip ci]'

      - name: Update production configuration
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd config
          git fetch origin main
          git checkout main
          cd the_project/overlays/production
          kustomize edit set image TODO-APP/IMAGE=${{ env.TODO_APP_IMAGE }}
          kustomize edit set image TODO-BACKEND/IMAGE=${{ env.TODO_BACKEND_IMAGE }}
          kustomize edit set image flhaka/broadcaster=${{ env.BROADCASTER_IMAGE }}

      - name: Commit production configuration
        if: startsWith(github.ref, 'refs/tags/')
        uses: EndBug/add-and-commit@v10
        with:
          cwd: ./config
          add: 'the_project/overlays/production/kustomization.yaml'
          message: 'Release production ${{ github.ref_name }} (${{ github.sha }}) [skip ci]'

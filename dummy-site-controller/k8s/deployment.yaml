apiVersion: apps/v1
kind: Deployment
metadata:
  name: dummy-site-controller
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dummy-site-controller
  template:
    metadata:
      labels:
        app: dummy-site-controller
    spec:
      serviceAccountName: dummy-site-controller-account
      containers:
        - name: dummy-site-controller
          image: flhaka/dummy-site-controller:latest
          imagePullPolicy: Always
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "200m"

apiVersion: apps/v1
kind: Deployment
metadata:
  name: pingpong-deployment
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pingpong
  template:
    metadata:
      labels:
        app: pingpong
    spec:
      containers:
        - name: pingpong
          image: flhaka/pingpong:latest
          imagePullPolicy: Always
          env:
          - name: PORT
            value: "3001"
          ports:
            - containerPort: 3001
